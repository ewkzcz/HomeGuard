<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    HomeGuard 图标：房子与盾牌合成的一个整体（屋顶带烟囱、底部是盾尖），几乎铺满画布，没有底板。
    材质：iOS 系统色多段渐变 + 玻璃质感（内侧受光边、顶部高光、斜向反光、底部暗部），全部在同一个形状里。
  -->
  <defs>
    <!-- 主体：iOS 青 → 蓝 → 靛 → 紫 -->
    <linearGradient id="body" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#70D7FF"/>
      <stop offset=".32" stop-color="#0A84FF"/>
      <stop offset=".68" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#B45CF0"/>
    </linearGradient>
    <!-- 左上体积光 -->
    <radialGradient id="glow" cx=".28" cy=".22" r=".62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部暗部 -->
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#1E1466" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E1466" stop-opacity=".28"/>
    </linearGradient>
    <!-- 斜向反光 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"/>
    </linearGradient>
    <!-- 顶部高光条：左亮右淡 -->
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 内侧受光边：左上亮、右下弱、底部回光 -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".5"/>
    </linearGradient>
    <clipPath id="clip">
      <path d="M476 178Q512 150 548 178L668 272V236Q668 220 684 220H720Q736 220 736 236V325L812 384Q844 409 844 450V560C844 722 706 824 548 870Q512 880 476 870C318 824 180 722 180 560V450Q180 409 212 384Z"/>
    </clipPath>
  </defs>

  <!-- 放大到几乎铺满画布 -->
  <g transform="translate(512 512) scale(1.34) translate(-512 -515)">
  <!-- 主体 -->
  <path d="M476 178Q512 150 548 178L668 272V236Q668 220 684 220H720Q736 220 736 236V325L812 384Q844 409 844 450V560C844 722 706 824 548 870Q512 880 476 870C318 824 180 722 180 560V450Q180 409 212 384Z" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#depth)"/>
    <!-- 斜向反光：玻璃左上半面 -->
    <path d="M150 120H760L150 760Z" fill="url(#sheen)"/>
    <!-- 顶部高光条，沿屋顶内侧 -->
    <path d="M238 420L512 206L640 306" fill="none" stroke="url(#spec)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 内侧受光边（只露出形状内侧的一半描边） -->
    <path d="M476 178Q512 150 548 178L668 272V236Q668 220 684 220H720Q736 220 736 236V325L812 384Q844 409 844 450V560C844 722 706 824 548 870Q512 880 476 870C318 824 180 722 180 560V450Q180 409 212 384Z" fill="none" stroke="url(#rim)" stroke-width="18"/>
  </g>
  </g>
</svg>
